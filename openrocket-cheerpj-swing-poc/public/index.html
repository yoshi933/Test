<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenRocket Swing CheerpJ PoC</title>
    <script src="https://cjrtnc.leaningtech.com/4.3/loader.js"></script>
    <style>
      body {
        margin: 0;
        background: #0f172a;
        color: #f8fafc;
        font-family: Inter, system-ui, sans-serif;
      }
      #status {
        padding: 12px 16px;
        border-bottom: 1px solid rgba(148, 163, 184, 0.3);
        background: rgba(15, 23, 42, 0.8);
      }
      #launcher-shell {
        padding: 16px;
      }
      #cheerpj-display {
        min-height: 640px;
        border: 1px solid rgba(148, 163, 184, 0.5);
        border-radius: 8px;
        overflow: hidden;
        background: #111827;
      }
      button {
        appearance: none;
        border: 1px solid #38bdf8;
        background: #0ea5e9;
        color: white;
        border-radius: 6px;
        padding: 8px 12px;
        cursor: pointer;
      }
      button.secondary {
        border-color: #94a3b8;
        background: #334155;
      }
      .muted {
        opacity: 0.8;
      }
      pre {
        white-space: pre-wrap;
        word-break: break-word;
      }
    </style>
  </head>
  <body>
    <div id="status">Preparing launch...</div>
    <div id="launcher-shell">
      <div id="cheerpj-display"></div>
    </div>
    <script>
      async function launch() {
        try {
          const status = document.querySelector('#status');
          status.textContent = 'Initializing CheerpJ...';
          await cheerpjInit({
              version: 11
          });
          cheerpjCreateDisplay(1200, 800);
          status.textContent = 'Starting Swing runtime...';
          await cheerpjRunJar('/app/engine/openrocket-app.jar');
          status.textContent = 'Launch finished';
        } catch (error) {
          console.error('CheerpJ launch failed', error);
          document.querySelector('#status').textContent = 'Launch failed. See console for details.';
        }
      }
      launch();
    </script>
  </body>
</html>
